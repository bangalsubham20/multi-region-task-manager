server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: multi-region-task-manager

  profiles:
    active: dev

  # Database Configuration (MySQL)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/task_manager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Maharani@99}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Management & Health Endpoints
management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "metrics"]
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger Documentation
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs